<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardputer 營地選單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one device screen in the middle, keys underneath, short notes beside. Page follows theme; the screen itself is always the night camp. */
:root {
  --bg: #efecf4; --fg: #231c38; --muted: #6b6386; --line: #d5cfe3;
  --bezel: #2a2440; --bezel-hi: #3a3358; --key: #f7f5fb; --key-fg: #231c38;
  --accent: #b77712;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-px: "Silkscreen", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #100c1d; --fg: #ebe5f7; --muted: #9b93b8; --line: #2c2545;
  --bezel: #1c172f; --bezel-hi: #2c2547; --key: #241e3a; --key-fg: #ebe5f7;
  --accent: #f2b544; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #100c1d; --fg: #ebe5f7; --muted: #9b93b8; --line: #2c2545;
  --bezel: #1c172f; --bezel-hi: #2c2547; --key: #241e3a; --key-fg: #ebe5f7;
  --accent: #f2b544; color-scheme: dark }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); padding: 24px 16px 40px; box-sizing: border-box }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 760px) minmax(0, 1fr); gap: 32px; align-items: start }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr) } }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; text-wrap: balance }
header p { margin: 0; color: var(--muted); font-size: 14px }
.device { background: var(--bezel); border-radius: 18px; padding: 18px; box-shadow: inset 0 1px 0 var(--bezel-hi), 0 18px 40px -24px rgba(20, 10, 40, .6) }
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 240 / 135; image-rendering: pixelated; border-radius: 4px; background: #120e24; outline: none }
canvas:focus-visible { box-shadow: 0 0 0 3px var(--accent) }
.keys { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center }
.keys button { font: 500 13px var(--f-ui); background: var(--key); color: var(--key-fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 44px; cursor: pointer }
.keys button kbd { font: 11px var(--f-px); color: var(--muted); margin-left: 4px }
.keys button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
aside { font-size: 14px; line-height: 1.7; min-width: 0 }
aside h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 500 }
aside section + section { margin-top: 24px }
.jump { display: flex; flex-wrap: wrap; gap: 6px }
.jump button { font: 13px var(--f-ui); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer }
.jump button[aria-current="true"] { border-color: var(--accent); color: var(--accent) }
table { border-collapse: collapse; width: 100%; font-size: 13px }
td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top }
td:first-child { font-family: var(--f-px); color: var(--accent); width: 72px; white-space: nowrap }
aside p { margin: 0; color: var(--muted) }
</style>

<div class="wrap">
  <header>
    <h1>Cardputer 營地選單</h1>
    <p>240×135 等比例原型 · 先點一下畫面，再用鍵盤操作</p>
  </header>
  <div>
    <div class="device">
      <canvas id="scr" width="960" height="540" tabindex="0" aria-label="Cardputer 螢幕原型"></canvas>
    </div>
    <div class="keys" id="keys">
      <button id="k-up" data-k="up">上<kbd>;</kbd></button>
      <button id="k-down" data-k="down">下<kbd>.</kbd></button>
      <button id="k-left" data-k="left">左<kbd>,</kbd></button>
      <button id="k-right" data-k="right">右<kbd>/</kbd></button>
      <button id="k-ok" data-k="ok">確定<kbd>Enter</kbd></button>
      <button id="k-space" data-k="space">翻面<kbd>Space</kbd></button>
      <button id="k-back" data-k="back">返回<kbd>`</kbd></button>
    </div>
  </div>
  <aside>
    <section>
      <h2>直接跳到</h2>
      <div class="jump" id="jump"></div>
    </section>
    <section>
      <h2>按鍵</h2>
      <table>
        <tr><td>; . , /</td><td>上下左右（方向鍵也可以）</td></tr>
        <tr><td>Enter</td><td>進入、送出</td></tr>
        <tr><td>`  Esc</td><td>回上一層</td></tr>
        <tr><td>Space</td><td>單字卡翻面</td></tr>
        <tr><td>1 2 3</td><td>單字卡：不會、模糊、會了</td></tr>
        <tr><td>a–z</td><td>守城打字：直接打字</td></tr>
      </table>
    </section>
    <section>
      <h2>說明</h2>
      <p>單字、KK 音標、新聞句子都是真資料：6000 字表加上 CMU 轉出來的 KK，新聞是 2026-10-01 的 NPR 文章。Claude 額度、Wi-Fi、天氣是示意數字。實機上的文字會換成點陣字型。</p>
    </section>
  </aside>
</div>

  // tent + fire (crop main tent and fire from the stage sheet)
  const tx = x0 + (opts.tentX ?? 22), ty = gy - 44;
  if (img.tent.complete) ctx.drawImage(img.tent, 0, 0, 32, 24, tx, ty + 0, 64, 48);

  if (Math.random() < dt * 6) sparks.push({ x: fx + (Math.random() * 6 - 3), y: fy - 8, life: 1, cx: x0 });
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; if (s.cx !== x0) continue; s.y -= dt * 14; s.x += Math.sin(t * 5 + i) * dt * 4; s.life -= dt * 0.9;
    if (s.life <= 0) { sparks.splice(i, 1); continue; } ctx.globalAlpha = s.life; R(Math.round(s.x), Math.round(s.y), 1, 1, s.life > .5 ? '#ffe28a' : P.red); ctx.globalAlpha = 1; }
  // princess by the fire
  const pf = opts.sleep ? 0 : Math.floor(t * 2) % 4;
  spr('queen', pf, tx + 22, gy - 30, 2);
  // goblins
  for (const gb of gobs) {
    if (opts.sleep) { ctx.save(); ctx.translate(x0 + gb.x + 16, gy - 8); ctx.rotate(-Math.PI / 2); spr(gb.sp, 0, -16, -16, 2); ctx.restore();
      const zt = (t * 0.8 + gb.x) % 2; ctx.globalAlpha = 1 - zt / 2; T('z', x0 + gb.x + 26 + zt * 4, gy - 16 - zt * 8, { s: 6 + zt * 2, f: PX, c: P.blue }); ctx.globalAlpha = 1; continue; }
    if (gb.pause > 0) { gb.pause -= dt; spr(gb.sp, Math.floor(t * 1.5) % 2 ? 0 : 1, x0 + gb.x, gy - 30, 2); continue; }
    gb.x += gb.dir * gb.v * dt;
    if (gb.x > w - 32) { gb.x = w - 32; gb.dir = -1; gb.pause = 1 + Math.random() * 2; }
    if (gb.x < 0) { gb.x = 0; gb.dir = 1; gb.pause = 1 + Math.random() * 2; }
    spr(gb.sp, 8 + Math.floor(t * 8) % 4, x0 + gb.x, gy - 30, 2, gb.dir < 0);
  }
  ctx.restore();
}

const defense = {
  reset() { this.mobs = []; this.typed = ''; this.hp = 3; this.score = 0; this.spawn = 1; this.rate = 3.2; this.over = false; this.fx = []; this.time = 0; },
  enter() { this.reset(); },
  draw(t, dt) {
    camp(0, 13, 240, 110, t, dt, { tentX: -6, groundH: 26 });
    statusBar('守城打字');
    if (!this.over) {
      this.time += dt; this.spawn -= dt;
      if (this.spawn <= 0) { const used = new Set(this.mobs.map(m => m.w[0]));
        let w; for (let i = 0; i < 20; i++) { w = DATA.typing[Math.floor(Math.random() * DATA.typing.length)]; if (!used.has(w[0])) break; }
        this.mobs.push({ w, x: 240, y: 72 + Math.floor(Math.random() * 3) * 7, v: 7 + Math.min(10, this.time / 8) + Math.random() * 3, sp: w.length > 7 ? 'ogre' : 'zombie' });
        this.rate = Math.max(1.3, this.rate * 0.96); this.spawn = this.rate; }
    }
    const target = this.typed ? this.mobs.find(m => m.w.startsWith(this.typed)) : null;
    this.mobs.sort((a, b) => a.y - b.y);
    for (const m of [...this.mobs]) {
      if (!this.over) m.x -= m.v * dt;
      spr(m.sp, 8 + Math.floor(t * 6) % 4, m.x, m.y, 2, true);
      const ww = TW(m.w, { s: 8, f: LAT, w: 700 }) + 6, lx = Math.round(m.x + 16 - ww / 2);
      R(lx, m.y - 11, ww, 10, m === target ? P.ink : 'rgba(16,12,32,.8)');
      if (m === target) { const a = T(this.typed, lx + 3, m.y - 3, { s: 8, f: LAT, w: 700, c: P.amber }); T(m.w.slice(this.typed.length), lx + 3 + a, m.y - 3, { s: 8, f: LAT, w: 700 }); }
      else T(m.w, lx + 3, m.y - 3, { s: 8, f: LAT, w: 700 });
      if (m.x < 30 && !this.over) { this.mobs.splice(this.mobs.indexOf(m), 1); this.hp--; blip(180, .2); if (this.typed && m === target) this.typed = '';
        if (this.hp <= 0) { this.over = true; st.best = Math.max(st.best, this.score); } }
    }
    for (let i = this.fx.length - 1; i >= 0; i--) { const f = this.fx[i]; f.life -= dt * 2; if (f.life <= 0) { this.fx.splice(i, 1); continue; }
      ctx.globalAlpha = f.life; T('+' + f.pts, f.x, f.y - (1 - f.life) * 14, { s: 8, f: PX, c: P.amber });
      for (let j = 0; j < 6; j++) R(f.x + Math.cos(j) * (1 - f.life) * 14, f.y + 10 + Math.sin(j) * (1 - f.life) * 10, 2, 2, P.green); ctx.globalAlpha = 1; }
    // HUD
    for (let i = 0; i < 3; i++) bitmap(['.#.#.', '#####', '#####', '.###.', '..#..'], 4 + i * 7, 17, i < this.hp ? P.red : P.line);
    T(String(this.score), 236, 22, { s: 8, f: PX, a: 'right', c: P.amber });
    R(0, 123, W, 12, P.panel2); T('›', 5, 132, { s: 9, f: PX, c: P.amber });
    T(this.typed + (Math.floor(t * 2) % 2 ? '_' : ''), 14, 132, { s: 8.5, f: LAT, w: 700 });
    T('直接打字', 234, 132, { s: 7, a: 'right', c: P.dim });
    if (this.over) { R(40, 40, 160, 52, 'rgba(16,12,32,.92)'); R(40, 40, 160, 1, P.red);
      T('營地被攻破了', 120, 60, { s: 11, w: 700, a: 'center', c: P.red });
      T(`${this.score} 分 · 最高 ${st.best}`, 120, 74, { s: 8, a: 'center' }); T('Enter 再來一次', 120, 86, { s: 7, a: 'center', c: P.dim }); }
  },
  key(k, raw) {
    if (k === 'back') { if (!this.over) st.best = Math.max(st.best, this.score); return go('home'); }
    if (this.over) { if (k === 'ok') this.reset(); return; }
    if (raw === 'Backspace') { this.typed = this.typed.slice(0, -1); return; }
    if (raw && /^[a-z]$/i.test(raw)) {
      const nt = this.typed + raw.toLowerCase();
      if (this.mobs.some(m => m.w.startsWith(nt))) { this.typed = nt; blip(1200, .02);

  },
};

    const step = d || 1;
    switch (this.row) {
      case 1: st.settings.acBrand = (st.settings.acBrand + step + 4) % 4; toast('品牌：' + BRANDS[st.settings.acBrand]); return;
      case 2: a.power = !a.power; this.send(a.power ? '開機' : '關機'); return;
      case 3: a.temp = Math.max(16, Math.min(30, a.temp + step)); break;
      case 4: a.mode = (a.mode + step + 5) % 5; break;
      case 5: a.fan = (a.fan + step + 4) % 4; break;
      case 6: a.swing = !a.swing; break;
    }
    if (a.power) this.send(`${a.temp}° ${MODES[a.mode]} 風${FANS[a.fan]}`);
  },
};

const clock = {
  draw(t, dt) {
    camp(0, 0, 240, 135, t, dt, { tentX: 88, groundH: 34, sleep: true });
    const now = new Date();
    ctx.globalAlpha = 0.25; R(0, 0, 240, 50, P.sky0); ctx.globalAlpha = 1;
    T(`${pad(now.getHours())}:${pad(now.getMinutes())}`, 120, 36, { s: 30, f: PX, a: 'center', c: '#fff3d6' });
    T(`${now.getMonth() + 1}/${now.getDate()} 週${WEEK[now.getDay()]}`, 120, 50, { s: 9, a: 'center', c: P.dim });
    T('台北 27° 多雲', 6, 130, { s: 8, c: P.dim });
    T('任意鍵返回', 234, 130, { s: 7, a: 'right', c: P.dim });
  },
  key() { go('home'); },
};

const SLEEP = ['30 秒', '1 分', '5 分', '永不'];
const settings = { sel: 0, top: 0,
  items() { const s = st.settings; return [
    { l: 'Wi-Fi', v: s.wifi || '未連線', go: 'wifi' },
    { l: '音量', bar: s.vol / 10, adj: d => { s.vol = Math.max(0, Math.min(10, s.vol + d)); blip(880); } },
    { l: '螢幕亮度', bar: s.bright / 10, adj: d => { s.bright = Math.max(1, Math.min(10, s.bright + d)); } },
    { l: '自動關螢幕', v: SLEEP[s.sleep], adj: d => { s.sleep = (s.sleep + d + 4) % 4; } },
    { l: '閒置 45 秒顯示營火時鐘', v: s.idleClock ? '開' : '關', adj: () => { s.idleClock = !s.idleClock; } },
    { l: '時區', v: 'UTC+8 台北' },
    { l: '英文程度', v: `Lv${s.level} · 跳級測驗 ›`, adj: d => { s.level = Math.max(3, Math.min(6, s.level + d)); } },
    { l: 'Claude 帳號', v: `${st.claude.accounts.length} 個 ›` },
    { l: '冷氣品牌', v: BRANDS[s.acBrand], adj: d => { s.acBrand = (s.acBrand + d + 4) % 4; } },
    { l: 'RSS 來源', v: 'NPR、BBC ›' },
    { l: '關於', v: 'v0.1 · SD 2.1/32 GB' } ]; },
  draw() {
    R(0, 0, W, H, P.panel); statusBar('設定');
    const its = this.items(), vis = 9, rh = 13;
    if (this.sel < this.top) this.top = this.sel; if (this.sel >= this.top + vis) this.top = this.sel - vis + 1;
    for (let i = 0; i < vis; i++) { const k = this.top + i, it = its[k]; if (!it) break; const y = 15 + i * rh, on = k === this.sel;
      if (on) R(2, y, 234, rh - 1, P.amberD);
      T(it.l, 8, y + 9, { s: 8, c: on ? P.amber : P.text, w: on ? 700 : 500 });
      if (it.bar != null) { bar(150, y + 4, 60, 4, it.bar, on ? P.amber : P.dim); T(Math.round(it.bar * 10) + '', 230, y + 9, { s: 7, f: PX, a: 'right' }); }
      else T(on && it.adj ? `‹ ${it.v} ›` : it.v, 230, y + 9, { s: 8, a: 'right', c: on ? P.text : P.dim }); }
    const th = Math.round(117 * vis / its.length), ty = 15 + Math.round((117 - th) * this.top / (its.length - vis));
    R(238, 15, 1, 117, P.line); R(237, ty, 3, th, P.dim);
  },
  key(k) { const its = this.items(), it = its[this.sel];
    if (k === 'up') { this.sel = (this.sel + its.length - 1) % its.length; blip(660); }
    if (k === 'down') { this.sel = (this.sel + 1) % its.length; blip(660); }
    if ((k === 'left' || k === 'right') && it.adj) it.adj(k === 'right' ? 1 : -1);
    if (k === 'ok') { if (it.go) go(it.go); else if (it.adj) it.adj(1); else toast('原型裡還沒做這頁'); }
    if (k === 'back') go('home'); },
};

const wifi = { sel: 0, scan: 0, state: '', list: [['HomeNet-5G', 4, true], ['HomeNet', 3, true], ['Goblin-Camp', 3, true], ['7-ELEVEN_FREE', 2, false], ['iPhone 熱點', 2, true], ['TPE-Free', 1, false]],
  enter() { this.scan = 1.6; this.state = ''; },
  draw(t, dt) {
    R(0, 0, W, H, P.panel); statusBar('Wi-Fi');
    if (this.scan > 0) { this.scan -= dt;
      const r = (t * 30) % 30; ctx.strokeStyle = P.blue; ctx.globalAlpha = 1 - r / 30; ctx.beginPath(); ctx.arc(120, 74, r, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      spr('scout', Math.floor(t * 4) % 4, 104, 58, 2); T('搜尋中…', 120, 110, { s: 9, a: 'center', c: P.dim }); return; }
    this.list.forEach(([n, sig, lock], i) => { const y = 16 + i * 15, on = i === this.sel, cur = n === st.settings.wifi;
      if (on) R(2, y, 236, 14, P.amberD);
      for (let b = 0; b < 4; b++) R(8 + b * 3, y + 10 - b * 2, 2, 2 + b * 2, b < sig ? (on ? P.amber : P.text) : P.line);
      T(n, 26, y + 10, { s: 8, w: cur ? 700 : 500, c: on ? P.amber : P.text, f: /[一-龥]/.test(n) ? TC : LAT });
      if (lock) bitmap(['.##.', '#..#', '####', '####'], 196, y + 5, P.dim);
      if (cur) T(this.state || '已連線', 232, y + 10, { s: 7, a: 'right', c: P.green }); });
    T('Enter 連線 · ` 返回', 232, 131, { s: 7, a: 'right', c: P.dim });
  },
  key(k) { if (this.scan > 0) return;
    if (k === 'up') this.sel = (this.sel + this.list.length - 1) % this.list.length;
    if (k === 'down') this.sel = (this.sel + 1) % this.list.length;
    if (k === 'ok') { st.settings.wifi = this.list[this.sel][0]; this.state = '連線中…'; setTimeout(() => { this.state = ''; toast('已連上 ' + st.settings.wifi); }, 1200); }
    if (k === 'back') go('settings'); },
};

const SCREENS = { home, vocab, news, defense, claude, remote, clock, settings, wifi };
const LABEL = { home: '主選單', vocab: '英語單字', news: '今日新聞', defense: '守城打字', claude: 'Claude 額度', remote: '遙控器', clock: '營火時鐘', settings: '設定' };
let cur = 'home', lastKey = performance.now();
function go(id) { cur = id; SCREENS[id].enter?.(); syncJump(); }

// ---------- input ----------
const MAP = { ';': 'up', ArrowUp: 'up', '.': 'down', ArrowDown: 'down', ',': 'left', ArrowLeft: 'left', '/': 'right', ArrowRight: 'right',
  Enter: 'ok', ' ': 'space', '`': 'back', Escape: 'back', '1': '1', '2': '2', '3': '3' };
function press(k, raw) {
  lastKey = performance.now();
  if (cur === 'clock' && k !== 'none') { go('home'); return; }
  SCREENS[cur].key(k, raw);
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if (cur === 'defense') {
    if (/^[a-z]$/i.test(e.key) || e.key === 'Backspace') { e.preventDefault(); press('type', e.key); return; }
    if (e.key === '`' || e.key === 'Escape') { e.preventDefault(); press('back'); return; }
    if (e.key === 'Enter') { e.preventDefault(); press('ok'); return; }
    return;
  }
  const k = MAP[e.key] || (e.key === 'Backspace' ? 'back' : null);
  if (!k) return; e.preventDefault(); press(k, e.key);
});
document.getElementById('keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { press(b.dataset.k); cv.focus({ preventScroll: true }); } });
cv.addEventListener('pointerdown', () => cv.focus({ preventScroll: true }));

const jump = document.getElementById('jump');
for (const id in LABEL) { const b = document.createElement('button'); b.textContent = LABEL[id]; b.dataset.id = id; b.id = 'jump-' + id;
  b.addEventListener('click', () => { go(id); if (id !== 'home') home.sel = Math.max(0, MENU.findIndex(m => m.id === id)); cv.focus({ preventScroll: true }); }); jump.appendChild(b); }
function syncJump() { for (const b of jump.children) b.setAttribute('aria-current', String(b.dataset.id === cur || (cur === 'wifi' && b.dataset.id === 'settings'))); }
syncJump();

// ---------- loop ----------
let last = performance.now();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; const t = reduce ? 0 : now / 1000;
  // idle → campfire clock
  // idle clock kicks in after 45 s on the home screen; screen-off timing is separate (not simulated here)
  if (cur === 'home' && st.settings.idleClock && now - lastKey > 45000) go('clock');
  ctx.clearRect(0, 0, W, H);
  SCREENS[cur].draw(t, reduce ? 0 : dt);
  if (st.toast) { const age = (now - st.toast.t) / 1000;
    if (age > 1.8) st.toast = null; else { const w = TW(st.toast.msg, { s: 8 }) + 14, y = 112 - Math.min(1, age * 8) * 4;
      ctx.globalAlpha = Math.min(1, (1.8 - age) * 4); R(120 - w / 2, y, w, 13, P.ink); R(120 - w / 2, y, 2, 13, P.amber);
      T(st.toast.msg, 120, y + 9.5, { s: 8, a: 'center' }); ctx.globalAlpha = 1; } }
  requestAnimationFrame(frame);
}
(document.fonts ? Promise.race([Promise.all(['500 9px "Noto Sans TC"', '700 9px "Noto Sans"', '9px "Silkscreen"'].map(f => document.fonts.load(f, '營地Aa'))), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve())
  .finally(() => requestAnimationFrame(frame));
</script>
